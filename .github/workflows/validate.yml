name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run unit tests
        working-directory: apple-keynote-motion
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: /tmp/apple-keynote-motion-pycache
        run: python -m compileall -q apple-keynote-motion/scripts apple-keynote-motion/tests

      - name: Verify skill manifest
        run: shasum -a 256 -c apple-keynote-motion/MANIFEST-SHA256.txt

      - name: Verify skill metadata
        run: |
          grep -Fxq 'name: apple-keynote-motion' apple-keynote-motion/SKILL.md
          grep -Fq 'description:' apple-keynote-motion/SKILL.md
          grep -Fxq '  display_name: "Apple Keynote Motion"' apple-keynote-motion/agents/openai.yaml
